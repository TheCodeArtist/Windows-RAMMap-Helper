name: Build Windows Executable

on:
  push:
    branches: main
    tags:
      - 'v*'
  pull_request:
    branches: main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Verify PyInstaller installation
      run: |
        pyinstaller --version
        
    - name: Build executable with PyInstaller
      run: |
        pyinstaller windows-rammap.spec
        
    - name: Verify executable was created
      run: |
        if (Test-Path "dist\windows-rammap.exe") {
          Write-Host "✓ Executable built successfully"
          Write-Host "File size: $((Get-Item dist\windows-rammap.exe).Length / 1MB) MB"
        } else {
          Write-Error "❌ Executable not found!"
          exit 1
        }
      shell: pwsh
      
    - name: Upload executable as artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-rammap-exe
        path: dist/windows-rammap.exe
        if-no-files-found: error
        retention-days: 90
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/windows-rammap.exe
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
